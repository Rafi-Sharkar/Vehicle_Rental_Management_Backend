services:
  postgres:
    image: postgres:17-alpine
    container_name: vrm_postgres_17
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-vrm_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vrm_password}
      POSTGRES_DB: ${DB_NAME:-vrm_db}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-vrm_user} -d ${DB_NAME:-vrm_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
